  - id: L14
    competition: Premier League
    chapter: 2004-05
    template: comparison
    form: line-race
    beat: b-relegation
    kicker: May · Relegation
    headline: Three clubs went down on 33 points. Everton stayed up on 39
    stat: { value: '33', label: 'Points for Leicester, Leeds and Wolves, all relegated' }
    chart:
      data: [epl_race.csv]
      preset: { preset: points-race, competition: Premier League, teams: [Everton, Man City, Leicester, Leeds, Wolves, Tottenham], month: null }
      encode: 'Left page: the bottom six’s cumulative points, games 1–38, y 0–45. Right page: the same six, home points against away points (paired bars).'
      highlight: The three relegated clubs share accent (one series, labelled individually at the line end); Everton in second; Manchester City and Tottenham muted.
      annotate:
        - 'Wolves won none of their 19 away games (D7 L12).'
        - 'Leeds conceded 79, the most in the league.'
      notes: The three relegated lines finish on the same point; stagger their end labels.
    body: >-
      Leicester, Leeds and Wolverhampton Wanderers all finished on 33 points and all went down. Leicester and
      Wolves had been promoted the summer before; Leeds, a Champions League semi-finalist three years earlier,
      were sinking under debt, sacked Peter Reid in November and conceded 79 goals, the most in the league.
      Wolves did not win a single away game. Leicester drew fifteen times, more than anyone except Newcastle.
      Above them, Everton slid from eleventh at halfway to seventeenth and survived on 39, six clear;
      Manchester City, top for one night in August, finished sixteenth. Portsmouth, the third promoted
      club, stayed up in thirteenth.
