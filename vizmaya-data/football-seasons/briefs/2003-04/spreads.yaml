  # ------------------------------------------------------------------ December
  - id: L06
    competition: Premier League
    chapter: 2003-12
    template: hero
    form: slope
    beat: b-halfway
    kicker: December · Halfway
    headline: At halfway four points covered the top three. By May it was fifteen
    stat: { value: '4 → 15', label: 'Points from first to third, after 19 games and after 38' }
    chart:
      data: [epl_race.csv]
      encode: Slope chart, left axis = table position after each club’s 19th game, right axis = final position. One line per club, all twenty.
      highlight: Manchester United (1st → 3rd) in accent, Arsenal (2nd → 1st) in second; Everton (11th → 17th, the biggest fall) labelled in ink.
      annotate:
        - 'Points at halfway: United 46, Arsenal 45, Chelsea 42.'
        - 'Biggest climbs: Aston Villa 10th → 6th, Bolton 12th → 8th, Tottenham 18th → 14th.'
      notes: The position at game 19 is each club's own 19th game, so clubs are compared at the same number of games.
    body: >-
      After nineteen games, half a season, Manchester United were top on 46 points, one ahead of Arsenal and
      four ahead of Chelsea. It was the closest the top three would be all year. Over the second half Arsenal
      took exactly what they had taken in the first, 45 points, Chelsea took 37 and United 29. By May the
      gap from first to third was fifteen points. Further down, the table moved less than it felt: Leeds and
      Wolves were in the bottom three at halfway and finished there, with Leicester one place above them. The biggest fall was Everton's,
      from eleventh to seventeenth, the biggest climb Aston Villa's, from tenth to sixth.
    caption: League position after each club's 19th game (left) and final position (right), all twenty clubs.
    source: 'Source: football-data.co.uk; standings by date, 3/1/0.'
    design:
      - Twenty lines is the limit for a slope; keep the 17 context lines at 0.5pt muted and push labels to the outer margins.
      - Club names on both axes in Label style, positions in tabular numerals.
    checks: []

  - id: U05
    competition: Champions League
    chapter: 2003-12
    template: comparison
    form: small-multiples
    beat: b-groups
    kicker: December · Champions League groups
    headline: The champions came through their group second
    stat: { value: '11', label: 'Porto’s points in Group F, three behind Real Madrid' }
    chart:
      data: [ucl_groups.csv]
      encode: Eight mini tables (A–H) in a 4 × 2 grid, four per page; each row = club, points bar, W-D-L in results colours.
      highlight: Porto in accent, Monaco in second. Rows that went on to the round of 16 in ink, third place (to the UEFA Cup) in muted, fourth in draw-grey.
      annotate:
        - 'Group C: Deportivo and PSV level on 10, Deportivo through on head-to-head.'
        - 'English clubs won groups B, E and G.'
      notes: Group order follows 2003-04 UEFA rules (head-to-head first), computed in spreads.py.
    body: >-
      The group stage ended on 10 December with few surprises at the top. Real Madrid won Group F with 14
      points and lost none of their six games; Manchester United, Juventus and Chelsea topped theirs. Porto
      finished second in Real Madrid's group, three points behind, after losing 3-1 to them at home in
      October, their only defeat of the whole competition. Monaco won Group C on 11 points, scoring 15, eight
      of them in one night. Deportivo went through from the same group only on head-to-head, level on points
      with PSV. Nobody looking at these eight tables picked out the finalists.
    caption: Final tables of the eight groups. Clubs in ink went through to the round of 16; third place went to the UEFA Cup.
    source: 'Source: engsoccerdata (jalapic); tie-breaks per UEFA 2003–04 rules.'
    design:
      - Eight tables in one visual, four per page, identical scales on the points bars.
      - Tables in Label style; the group letter in Deck.
    checks: []

  # ------------------------------------------------------------------ January
  - id: L07
    competition: Premier League
    chapter: 2004-01
    template: hero
    form: strip
    beat: b-ferdinand
    kicker: January · Manchester United
    headline: United took 2.27 points a game before Ferdinand's ban and 1.56 after it
    stat: { value: '1.56', label: 'United’s points per game from 20 January, down from 2.27' }
    chart:
      data: [epl_race.csv]
      preset: { preset: results-strip, competition: Premier League, teams: [Man United], month: null }
      encode: United’s 38 league results as one strip, game by game, W ink / D draw-grey / L accent; a thin running points-per-game line above it.
      highlight: A vertical rule at 20 January, labelled “Ferdinand’s ban begins”; the two ppg values set in Stat beside each half.
      annotate:
        - 'Before: 22 games, 50 points, 15 conceded. After: 16 games, 25 points, 20 conceded.'
      notes: The split falls between game 22 (17 Jan, Wolves 1–0 United) and game 23.
    body: >-
      Rio Ferdinand missed a drugs test on 22 September. In December the FA banned him for eight months, and
      the ban began on 20 January. Up to then Manchester United had taken 50 points from 22 league games, 2.27
      a game, and conceded 15. From then on they took 25 from 16, 1.56 a game, and conceded 20. Ferdinand was
      not the only reason. Ruud van Nistelrooy scored 20 league goals but the side around him was changing,
      and Arsenal and Chelsea were simply better over the spring. But the line on this strip is where United's
      title defence turned into a race for third. They won the FA Cup in May instead.
    caption: Manchester United's league results in order, with points per game before and after Rio Ferdinand's ban began on 20 January 2004.
    source: 'Source: football-data.co.uk; ban date from contemporary reports.'
    design:
      - Strip cells sized so 38 fit the chart region width (x 3.75–12); the rule at the split in ink 0.5pt.
      - Don't colour the halves differently; the results colours already carry it.
    checks:
      - Ban start date 20 January 2004 is from contemporary reports, not our data; events.csv only has the 19 December hearing.
      - Correlation, not cause — the body says so; keep it.

  - id: L08
    competition: Premier League
    chapter: 2004-01
    template: table
    form: table
    beat: b-ferdinand
    kicker: January · The table
    headline: United went into February top, a point ahead of Arsenal with a game more played
    stat: { value: '53', label: 'Manchester United’s points after 23 games, 31 January' }
    chart:
      data: [epl_month_tables.csv]
      preset: { preset: month-table, competition: Premier League, teams: [], month: 2004-01 }
      encode: The full table at 31 January, 20 rows, columns P W D L GF GA GD Pts.
      highlight: United’s row in accent, Arsenal’s in second; the zero in Arsenal's L column set in Stat weight.
      annotate:
        - 'Arsenal: 22 played, 15–7–0. United: 23 played, 17–2–4.'
      notes: The last month-end United led; by the end of February Arsenal were nine clear.
    body: >-
      At the end of January, Manchester United were top of the league on 53 points from 23 games. Arsenal
      were a point behind with a game in hand and still had a nought in the defeats column after 22. Chelsea
      were six further back. It was the last time United would lead at the end of a month. Ferdinand's ban
      had begun eleven days earlier; Arsenal had signed José Antonio Reyes from Sevilla for £10.5m. Over the
      next four weeks Arsenal won all five of their league games and United took five points from four. By the
      end of February the gap was nine points, the other way round.
    caption: Premier League table at 31 January 2004.
    source: 'Source: football-data.co.uk; 3/1/0, ties on GD then GF.'
    design:
      - Table on the right page full height; tabular numerals, rules only every five rows.
      - Bottom three rows in draw-grey.
    checks:
      - Reyes fee (£10.5m) from events.csv.

  # ------------------------------------------------------------------ February
  - id: L09
    competition: Premier League
    chapter: 2004-02
    template: hero
    form: strip
    beat: b-leaders
    kicker: February · The lead
    headline: Six clubs led the table. After 1 February, only Arsenal did
    stat: { value: '20', label: 'Times the lead changed hands, all before 1 February' }
    chart:
      data: [epl_leader_by_date.csv]
      encode: A ribbon of the 97 match dates, 16 August → 15 May, each cell coloured by the club top of the table that night.
      highlight: Arsenal’s cells in accent, Chelsea’s in second, United’s in ink; Blackburn, Manchester City and Portsmouth (August only) in muted with labels.
      annotate:
        - 'A rule at 1 February: “the last change at the top”.'
        - 'Days at the top: Arsenal 215, Manchester United 30, Chelsea 19, Blackburn 7, Man City 1, Portsmouth 1.'
      notes: Cells are match dates, not calendar days; the days-at-the-top counts are calendar days between match dates.
    body: >-
      In the first two weeks of the season Blackburn, Manchester City and Portsmouth all spent a night at the
      top of the Premier League. By the end of the season six clubs had led it, and the lead had changed hands
      twenty times. Arsenal and Chelsea swapped it through the autumn; Manchester United held it for most of
      December and January. On 1 February Arsenal beat Manchester City 2-1 at Highbury and went top again.
      Nobody else led for the rest of the season. From that day the story stopped being who would win the
      league and became whether Arsenal could finish it unbeaten.
    caption: The club top of the Premier League after each matchday, 2003-04. Each cell is one match date.
    source: 'Source: football-data.co.uk; standings by date, 3/1/0, ties on GD then GF.'
    design:
      - Ribbon is one row of 97 cells across the chart region, 8–10mm tall; labels for the August leaders sit above the cells.
      - The calendar-days counts as a small Label-style key under the ribbon, ordered by days.
    checks: []

  - id: L10
    competition: Premier League
    chapter: 2004-02
    template: comparison
    form: bar
    beat: b-goals-month
    kicker: February · Goals
    headline: February was the season's highest-scoring month; March was the home sides'
    stat: { value: '3.21', label: 'Goals per game in February 2004' }
    chart:
      data: [epl_goals_by_month.csv]
      preset: { preset: goals-by-month, competition: Premier League, teams: [], month: null }
      encode: 'Left: goals per game by month, August → May (10 bars). Right: home-win share by month (10 bars), same months.'
      highlight: February in accent on the left, March in accent on the right; other months muted.
      annotate:
        - 'Season average 2.66 goals a game: a 0.5pt reference line across the left bars.'
        - 'March: home sides won 22 of 34 (64.7%); the season average was 43.9%.'
      notes: Months with fewer matches (September 30, March 34) swing more; say so in the caption.
    body: >-
      The 380 league games produced 1,012 goals, 2.66 a game, but the months were not alike. October was the
      tightest, at 2.22 a game. February was the loosest: 125 goals in 39 matches, 3.21 a game, including
      Tottenham 4 Leicester 4. March was the odd month for a different reason. Home sides won 22 of its 34
      games, almost two in three, when across the season they won fewer than half. None of this explains a
      title or a relegation, but it is the texture of a season, the weeks when every game seemed to finish
      3-2 and the weeks when nobody could win away.
    caption: Goals per game (left) and share of games won by the home side (right), by month. September (30 games) and March (34) are small samples.
    source: 'Source: football-data.co.uk.'
    design:
      - Two bar charts sharing one month axis across the gutter; same bar width both sides.
    checks: []

