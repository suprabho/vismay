      Milan, the holders, won the first leg of their quarter-final 4-1 against Deportivo at San Siro, and
      Real Madrid beat Monaco 4-2 in Madrid. Both ties were thought settled. On 6 April Monaco won 3-1 at
      home and went through on away goals, Fernando Morientes, on loan from Real Madrid, scoring against the
      club that owned him. The next night Deportivo beat Milan 4-0 at the Riazor. The other two ties went
      the way the first legs pointed: Porto past Lyon, Chelsea past Arsenal. None of the four semi-finalists
