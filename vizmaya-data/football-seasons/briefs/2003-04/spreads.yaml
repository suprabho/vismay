    body: >-
      Arsenal finished the 2003-04 league season with 26 wins, 12 draws and no defeats, 73 goals scored and 26
      conceded. They were behind at half-time five times and took 13 points from those games. They went to
      Old Trafford, Anfield and Stamford Bridge as the bookmakers' underdogs and lost none of the three. Their
      expected goals, by StatsBomb's model, came to 60.9 for and 30.9 against, a side that made twice the
