    chart:
      data: [epl_table_final.csv, epl_upsets.csv]
      encode: 'Left: x = points implied by pre-match odds, y = actual points, all 20 clubs, with a 45° line (did as expected). Right: the season’s five biggest upsets as a ranked list with the implied win chance.'
      highlight: Arsenal in accent, Manchester City in second; others muted, labelled only beyond ±5.
      annotate:
        - 'Above the line: Arsenal +14.0, Bolton +8.6. Below: Man City −9.9, Leeds −9.7, Everton −9.0.'
        - 'Biggest upset: Manchester United 2–3 Middlesbrough, 11 February (Middlesbrough 8.5%).'
      notes: Expected points = 3 × P(win) + P(draw) per game from Bet365 odds with the margin removed, summed.
    body: >-
      Bookmakers set a price on every game, and the prices add up to a forecast. Take the margin out of
      Bet365's odds for each of Arsenal's 38 games and they implied about 76 points; Arsenal took 90. Bolton,
      under Sam Allardyce, beat their prices by almost nine. At the other end Manchester City, Leeds and
      Everton each fell about ten points short of what the market expected of them. The biggest single
      upset by the odds was Middlesbrough's 3-2 win at Old Trafford in February, a result the prices gave
      less than a one-in-eleven chance.
    caption: Points implied by pre-match odds against points won (left); the five least likely wins of the season (right).
    source: 'Source: football-data.co.uk (Bet365 odds), margin removed by normalising the three implied probabilities.'
