# League- and cup-level spreads for the 2003-04 book: Premier League (league) and Champions League (cup).
#
# The source for the design briefs. `python3 -I scripts/briefs.py --season 2003` renders
#   premier-league.md, champions-league.md, flatplan.md  (the briefs a designer works from)
#   plan.json                                            (the same spreads as a Books-tab plan: beats + spreads, planSchema)
#
# A league-level spread is about the whole competition (every club, the table, the race), not one match.
# A cup-level spread is about the tournament's shape: rounds, ties, roads to the final.
# Spreads are listed in reading order. Templates, chart forms and colours come from the locked series system
# (apps/admin/lib/seasonBooks/system.ts, SYSTEM_VERSION 2): accent #D7372B, second #1F5AA6, muted #8A8780,
# results W ink / D draw-grey / L accent. Every number below is in briefs/2003-04/data/ (built by scripts/spreads.py).
#
# Team names in a `preset` binding are the raw source labels (football-data.co.uk), as admin_historical_matches stores them.

season: 2003
system_version: 2

beats:
  - id: b-unbeaten
    text: Arsenal went the whole league season unbeaten, 26 wins and 12 draws, and won it by 11 points.
    month: 2004-05
    kind: record
    strength: 3
    teams: Arsenal
    evidence: epl_table_final.csv (26-12-0, 90 pts); epl_leader_by_date.csv (11-point final margin); events.csv 2004-05-15
  - id: b-spend
    text: Chelsea, bought by Roman Abramovich in July, spent £107.8m on nine £5m-plus signings before September.
    month: 2003-08
    kind: people
    strength: 3
    teams: Chelsea
    evidence: epl_summer_signings.csv (nine deals, £107.8m; the other 19 clubs £42.5m); events.csv 2003-07 ownership
  - id: b-qualifying
    text: Newcastle won in Belgrade and still went out of the Champions League in August, on penalties at home to Partizan.
    month: 2003-08
    kind: europe
    strength: 2
    teams: Newcastle United, Partizan
    evidence: ucl_ties.csv Q-3 Partizan v Newcastle 0-1, 1-0, penalties 4-3
  - id: b-funnel
    text: Seventy-two clubs from 48 countries entered the Champions League in July; 32 reached the group stage in September.
    month: 2003-09
    kind: europe
    strength: 2
    teams: ''
    evidence: ucl_stages.csv; ucl_clubs.csv (72 clubs, 48 countries)
  - id: b-crowds
    text: Old Trafford averaged 67,641 a game, four times the crowd Fulham drew at Loftus Road.
    month: 2003-09
    kind: other
    strength: 1
    teams: Manchester United, Fulham
    evidence: epl_table_final.csv avg_attendance (Wikipedia / worldfootball.net)
  - id: b-close-autumn
    text: Until Christmas, first and third in the Premier League were never more than five points apart.
    month: 2003-10
    kind: title-race
    strength: 2
    teams: Arsenal, Chelsea, Manchester United
    evidence: epl_race.csv, 1 Sep - 31 Dec 2003
  - id: b-shots
    text: Liverpool took more league shots than anyone, 558, and finished 30 points behind Arsenal.
    month: 2003-10
    kind: other
    strength: 1
    teams: Liverpool, Arsenal
    evidence: epl_table_final.csv shots, Pts
  - id: b-eight-three
    text: Monaco beat Deportivo 8-3 in the group stage, and Deportivo still reached the semi-finals.
    month: 2003-11
    kind: europe
    strength: 3
    teams: Monaco, Deportivo La Coruña
    evidence: ucl_matches.csv 2003-11-05; ucl_clubs.csv (Deportivo reached the semi-finals)
  - id: b-halfway
    text: At halfway four points covered the top three, with Manchester United first; by May it was fifteen and United were third.
    month: 2003-12
    kind: turning-point
    strength: 2
    teams: Manchester United, Arsenal, Chelsea
    evidence: epl_race.csv game 19 vs game 38
  - id: b-groups
    text: Porto, the eventual champions, came through their group second, three points behind Real Madrid.
    month: 2003-12
    kind: europe
    strength: 2
    teams: Porto, Real Madrid
    evidence: ucl_groups.csv group F
  - id: b-ferdinand
    text: United took 2.27 points a game before Rio Ferdinand's eight-month ban began on 20 January and 1.56 after it.
    month: 2004-01
    kind: collapse
    strength: 3
    teams: Manchester United
    evidence: epl_race.csv split at 2004-01-20; events.csv 2003-12-19 (ban handed down)
  - id: b-leaders
    text: Six clubs led the Premier League in 2003-04, the lead changed hands 20 times, and after 1 February only Arsenal led.
    month: 2004-02
    kind: title-race
    strength: 3
    teams: Arsenal
    evidence: epl_leader_by_date.csv (changed = True, 20 rows; last 2004-02-01)
  - id: b-goals-month
    text: February was the season's highest-scoring month at 3.21 goals a game, and in March home sides won 22 of 34.
    month: 2004-02
    kind: other
    strength: 1
    teams: ''
    evidence: epl_goals_by_month.csv
  - id: b-england-europe
    text: English clubs won three of the eight Champions League groups and none of them reached the final.
    month: 2004-03
    kind: europe
    strength: 2
    teams: Arsenal, Chelsea, Manchester United, Newcastle United
    evidence: ucl_groups.csv (B, E, G winners); ucl_english_clubs.csv
  - id: b-henry
    text: Thierry Henry scored 30 league goals from 23.9 expected, seven of them in eight days of April.
    month: 2004-04
    kind: record
    strength: 3
    teams: Arsenal
    evidence: epl_top_scorer_shots.csv (StatsBomb); epl_scorers.csv
  - id: b-comebacks
    text: Two quarter-finals turned in the second leg, Deportivo from 4-1 down against the holders Milan and Monaco from 4-2 down against Real Madrid.
    month: 2004-04
    kind: europe
    strength: 3
    teams: Deportivo La Coruña, AC Milan, Monaco, Real Madrid
    evidence: ucl_ties.csv QF
  - id: b-monaco-scorers
    text: Monaco had the competition's two top scorers, Fernando Morientes with nine and Dado Pršo with seven.
    month: 2004-04
    kind: europe
    strength: 1
    teams: Monaco
    evidence: ucl_scorers.csv (UEFA via Wikipedia)
  - id: b-relegation
    text: Leicester, Leeds and Wolves all went down on 33 points while Everton survived on 39.
    month: 2004-05
    kind: survival
    strength: 2
    teams: Leicester City, Leeds United, Wolverhampton Wanderers, Everton
    evidence: epl_table_final.csv
  - id: b-final
    text: Porto won the final 3-0 with four shots worth 0.50 expected goals.
    month: 2004-05
    kind: europe
    strength: 3
    teams: Porto, Monaco
    evidence: ucl_final_shots.csv, ucl_final_team.csv (StatsBomb)
  - id: b-roads
    text: Porto lost once in thirteen Champions League games; Monaco lost four times and still reached the final.
    month: 2004-05
    kind: europe
    strength: 2
    teams: Porto, Monaco
    evidence: ucl_finalists_road.csv
  - id: b-mourinho
    text: Seven days after the final, Porto's José Mourinho became Chelsea manager.
    month: 2004-05
    kind: people
    strength: 2
    teams: Porto, Chelsea
    evidence: events.csv 2004-06-02 (and 2004-05-31 Ranieri sacked)
  - id: b-home
    text: Home sides won 167 of the 380 league games, and nobody beat Arsenal home or away.
    month: 2004-05
    kind: other
    strength: 1
    teams: ''
    evidence: epl_results_grid.csv
  - id: b-odds
    text: Arsenal took 14 more points than the bookmakers' prices implied and Manchester City about 10 fewer.
    month: 2004-05
    kind: other
    strength: 1
    teams: Arsenal, Manchester City
    evidence: epl_table_final.csv xpts_from_odds (Bet365, margin removed)
  - id: b-countries
    text: Portugal sent two clubs to the Champions League and one of them won it.
    month: 2004-05
    kind: europe
    strength: 2
    teams: Porto
    evidence: ucl_countries.csv
  - id: b-knockouts
    text: Eight of the fifteen knockout ties were settled by one goal or on away goals, and Monaco went through twice on away goals.
    month: 2004-05
    kind: europe
    strength: 1
    teams: Monaco
    evidence: ucl_ties.csv R16-final

spreads:
  # ------------------------------------------------------------------ frame
  - id: C00
    competition: Book
    chapter: cover
    template: cover
    form: big-number
    kicker: Football seasons · Book 2
    headline: '2003–04'
    stat: { value: '2003–04', label: 'Season, set in Display' }
    chart:
      notes: The season set as one Display numeral across the front cover; no chart.
    body: >-
      The season nobody beat Arsenal. Thirty-eight league games, twenty-six wins, twelve draws, no defeats.
      The season a Russian billionaire bought Chelsea and spent more in one summer than the rest of the
      league together. And the season a club from Porto, coached by a 41-year-old called José Mourinho,
      won the Champions League.
    caption: ''
    source: ''
    design:
      - Front (right page) carries only the season numeral and the series line. Back (left) carries the blurb.
      - Image region is a flat paper field with the numeral in ink; no club crests (licensing) and no photography.
    checks:
      - Mourinho's age at the final (41) — born 26 January 1963; confirm before print.

  - id: L01
    competition: Premier League
    chapter: intro
    template: intro
    form: line-race
    beat: b-unbeaten
    kicker: Season intro · Premier League
    headline: Nobody beat Arsenal. Thirty-eight games, ninety points, eleven clear
    stat: { value: '26–12–0', label: 'Arsenal’s league record: won, drawn, lost' }
    chart:
      data: [epl_race.csv]
      preset: { preset: points-race, competition: Premier League, teams: [Arsenal, Chelsea, Man United, Liverpool], month: null }
      encode: x = game number 1–38; y = cumulative points 0–90. One line per club.
      highlight: Arsenal in accent, Chelsea in second; Manchester United and Liverpool labelled in muted; the other 16 clubs as 0.5pt muted context lines, unlabelled.
      annotate:
        - 'Game 30, 28 March: “30 unbeaten from the start, a record” (1–1 v Manchester United).'
        - 'Game 34, 25 April: title won at White Hart Lane, four games left.'
        - 'Final point labels at the line end: Arsenal 90, Chelsea 79, Man United 75, Liverpool 60.'
      notes: The chart every later league spread zooms into; keep its scale (0–90) wherever the race returns.
    body: >-
      Six clubs led the Premier League in 2003-04 and the lead changed hands twenty times, most of them before
      February. After the first of February it never moved again. Arsenal took 45 points from their first
      nineteen games and 45 from their last nineteen, won 26, drew 12 and lost none, the first unbeaten
      top-flight season in England since Preston in 1888-89. Behind them Chelsea, rebuilt with Roman
      Abramovich's money, finished second on 79; Manchester United, top at halfway, fell to third. In Europe
      the season belonged to clubs nobody had tipped: Porto beat Monaco in the final. This book follows both,
      month by month.
    caption: Cumulative league points after each game, every club. Arsenal and Chelsea highlighted; Manchester United and Liverpool labelled.
    source: 'Source: football-data.co.uk results; points 3/1/0.'
    design:
      - Chart region spans the right page (x 6.5–12, y 0–6.75); headline over 2.5 rows at 1.15× Headline.
      - The 16 context lines are one muted group; no legend, direct labels only at the line ends of the four named clubs.
      - Draw the two annotation leaders at 0.5pt to the Arsenal line; captions in Caption style.
    checks:
      - '“First unbeaten top-flight season since Preston 1888–89” is not in our data: confirm wording against a published source.'

  # ------------------------------------------------------------------ August
  - id: L02
    competition: Premier League
    chapter: 2003-08
    template: hero
    form: bar
    beat: b-spend
    kicker: August · Transfers
    headline: Chelsea spent two and a half times what the rest of the league did
    stat: { value: '£107.8m', label: 'Chelsea’s nine £5m-plus signings, July to 1 September' }
    chart:
      data: [epl_summer_signings.csv]
      encode: One horizontal bar per club that made a £5m-plus signing, length = total fee (£m). Chelsea’s bar is segmented by player, largest first.
      highlight: Chelsea in accent with player names on the segments (Duff 17.0, Crespo 16.8, Makélélé 16.6, Mutu 15.8, Verón 15.0, Geremi 7.0, Bridge 7.0, Joe Cole 6.6, Glen Johnson 6.0). Other clubs in muted.
      annotate:
        - 'A bracket under the five muted bars: “the other 19 clubs together: £42.5m”.'
      notes: Order bars by total. Manchester United 18.24 (Ronaldo 12.24, Kléberson 6.0), Blackburn 7.5, Tottenham 6.25, Birmingham 5.5, Liverpool 5.0.
    body: >-
      Roman Abramovich bought Chelsea in July 2003, and by the time the transfer window shut the club had
      signed nine players for £5m or more: Damien Duff, Hernán Crespo, Claude Makélélé, Adrian Mutu,
      Juan Sebastián Verón and four more. Together they cost £107.8m. Every other Premier League club put
      together made six signings of that size, for £42.5m, and the biggest of those was Manchester United's
      £12.24m for an 18-year-old from Sporting called Cristiano Ronaldo. Claudio Ranieri, who had finished
      fourth the season before, now had two players for most positions. The money bought second place, 79
      points, and a Champions League semi-final. It did not buy the title.
    caption: Total fees paid for £5m-plus signings, 1 June to 1 September 2003, by Premier League club. Chelsea's bar is split into its nine signings.
    source: 'Source: Wikipedia, List of English football transfers summer 2003 (reported fees); £5m-plus moves only.'
    design:
      - Bars run left to right across the gutter in the chart region (x 3.75–12); keep Chelsea’s bar first and full-width so the rest look small at the same scale.
      - Segment labels inside Chelsea’s bar in Label style, ink on accent at 100% would fail contrast — set them paper on accent.
      - Stat in Numerals at 54pt in the left column under the headline.
    checks:
      - Fees are as reported at the time and Wikipedia's list only holds deals at or above about £5m; say “£5m-plus signings” every time, never “spending”.
      - Abramovich's purchase date (July 2003) comes from events.csv, which is not hand-verified yet.

  - id: U01
    competition: Champions League
    chapter: 2003-08
    template: timeline
    form: timeline
    beat: b-qualifying
    kicker: August · Champions League qualifying
    headline: Forty ties to fill sixteen places, and Newcastle lost theirs on penalties
    stat: { value: '4–3', label: 'Partizan’s shoot-out win at St James’ Park, 19 August' }
    chart:
      data: [ucl_ties.csv, ucl_matches.csv]
      encode: Three lanes, one per qualifying round (Q1 16–23 Jul, Q2 30 Jul–6 Aug, Q3 12–20 Aug), on a shared date axis 16 July → 20 August. Each tie is a short bar from first-leg to second-leg date; the winner’s name sits at the bar end.
      highlight: Newcastle–Partizan in accent; Chelsea–Žilina (5–0 on aggregate) in second. Ties settled on penalties or away goals marked with a small open circle.
      annotate:
        - 'Q3: Partizan 0–1 Newcastle, Newcastle 0–1 Partizan, 4–3 on penalties.'
        - 'Partizan also needed away goals to get past Djurgården in Q2.'
      notes: 10 + 14 + 16 = 40 ties; the 16 Q3 winners join the 16 clubs that went straight into the groups.
    body: >-
      The Champions League began on 16 July, a month before the Premier League, with twenty champions of
      Europe's smaller leagues. By 20 August forty ties had been played and sixteen clubs had won a place
      in the group stage. Newcastle United, third in England the season before, were one of the casualties.
      They won 1-0 in Belgrade, lost 1-0 at home to Partizan and went out 4-3 on penalties. Partizan had
      already needed away goals to beat Djurgården in the previous round. Chelsea, fourth the season before,
      came through the same round 5-0 against Žilina, and went on to the semi-finals.
    caption: Every qualifying tie, July and August 2003, by round. Bars run from first leg to second leg; circles mark ties settled on penalties or away goals.
    source: 'Source: engsoccerdata (jalapic) Champions League results.'
    design:
      - Lanes take the chart band (y 2.75–5.5) across both pages; dates as Label-style ticks every week.
      - 40 bars is dense; keep winner labels only on Q3 and on the highlighted ties, muted dots elsewhere.
    checks:
      - Partizan's away-goals win over Djurgården (3–3) and the shoot-outs are from engsoccerdata's pens column; spot-check against UEFA.

  # ------------------------------------------------------------------ September
  - id: U02
    competition: Champions League
    chapter: 2003-09
    template: hero
    form: bar
    beat: b-funnel
    kicker: September · Champions League
    headline: Seventy-two clubs from 48 countries started. By September, 32 were left
    stat: { value: '72', label: 'Clubs that played in the 2003–04 Champions League' }
    chart:
      data: [ucl_stages.csv, ucl_clubs.csv]
      encode: A stepped funnel of vertical bars, one per stage, height = clubs still in (20 → 28 → 32 → 32 → 16 → 8 → 4 → 2 → 1). Label each step with the stage name and the count.
      highlight: Two thin tracks through the steps, Porto in accent and Monaco in second, both entering at the group stage.
      annotate:
        - '“16 clubs went straight into the groups — both finalists among them.”'
      notes: Q1 20 clubs, Q2 28 (10 winners + 18 new), Q3 32 (14 + 18), groups 32 (16 + 16), R16 16, QF 8, SF 4, final 2, winner 1.
    body: >-
      Seventy-two clubs from 48 countries played in the 2003-04 Champions League. Twenty began in the first
      qualifying round in mid-July; eighteen more joined in each of the next two rounds; sixteen, the
      champions and runners-up of the biggest leagues, waited for the group stage. When the groups were
      drawn there were 32 clubs left, from 15 countries. Both clubs who would reach the final in Gelsenkirchen
      were among the sixteen that skipped qualifying, but neither had been a favourite: Porto were Portuguese
      champions and UEFA Cup holders, Monaco had finished second in France. Two of the four semi-finalists,
      Chelsea and Deportivo, had started in August.
    caption: Clubs still in the competition at each stage. Porto and Monaco traced through.
    source: 'Source: engsoccerdata (jalapic) Champions League results.'
    design:
      - Steps read left to right across the gutter; the group stage step (32) sits on the page break so the qualifying rounds are left, the knockouts right.
      - Stat 72 in Numerals; count labels in Label style above each step.
    checks:
      - Porto as UEFA Cup holders (won May 2003) is outside this season's data; confirm.

  - id: L03
    competition: Premier League
    chapter: 2003-09
    template: comparison
    form: bar
    beat: b-crowds
    kicker: September · Crowds
    headline: Old Trafford held four Loftus Roads
    stat: { value: '67,641', label: 'Manchester United’s average home league crowd' }
    chart:
      data: [epl_table_final.csv]
      encode: Twenty horizontal bars, average home attendance, largest first, split across the two pages (1–10 left, 11–20 right) on one shared scale.
      highlight: Manchester United in accent, Fulham in second; all others muted.
      annotate:
        - 'Fulham: 16,342 at Loftus Road, the ground they shared while Craven Cottage was rebuilt.'
      notes: 'Top: Man United 67,641, Newcastle 51,440, Man City 46,834 (first season at the City of Manchester Stadium). Bottom: Fulham 16,342, Portsmouth 20,108, Blackburn 24,376.'
    body: >-
      Manchester United averaged 67,641 at Old Trafford, more than four times the 16,342 Fulham drew at
      Loftus Road, the Queens Park Rangers ground they rented while Craven Cottage was rebuilt. The gap was
      about more than demand. Newcastle (51,440) and Manchester City (46,834, in their first season at the
      new City of Manchester Stadium) had the room; Arsenal, the champions, played to 38,079 at Highbury,
      seventh in the league. Portsmouth, promoted, squeezed 20,108 into Fratton Park. Across the season
      the Premier League drew about 13.3 million people to 380 games.
    caption: Average home league attendance, 2003-04, all twenty clubs, on one scale across both pages.
    source: 'Source: worldfootball.net via Wikipedia, 2003–04 FA Premier League.'
    design:
      - Split the ranking at the gutter, not by size; keep the scale identical on both pages so Fulham’s bar is visibly a quarter of United’s.
      - Value labels at the bar end, tabular numerals.
    checks:
      - Fulham's ground share at Loftus Road (2002–04) and City's first season at the new stadium are not in our data; confirm.
      - The 13.3 million total is avg_attendance × 19 summed over the Wikipedia table (13,297,359).

  # ------------------------------------------------------------------ October
  - id: L04
    competition: Premier League
    chapter: 2003-10
    template: hero
    form: line-race
    beat: b-close-autumn
    kicker: October · The title race
    headline: Until Christmas, first and third were never more than five points apart
    stat: { value: '5', label: 'Biggest gap from first to third, September to December' }
    chart:
      data: [epl_race.csv, epl_leader_by_date.csv]
      preset: { preset: points-race, competition: Premier League, teams: [Arsenal, Chelsea, Man United], month: null }
      encode: The intro’s race cropped to 16 August – 31 December (games 1–19); y from 0 to 50 so the three lines separate.
      highlight: Arsenal accent, Chelsea second, Manchester United ink at 0.75pt with a direct label (the third series stays un-coloured, per the chart style).
      annotate:
        - 'Shade the band between the top and third line; label its widest point (5 points).'
        - '21 Sep: Manchester United 0–0 Arsenal at Old Trafford (Vieira sent off, Van Nistelrooy missed a late penalty).'
      notes: The preset draws the whole season; crop to games 1–19 in the layout, not the data.
    body: >-
      For four months the title was a three-way argument. Between September and the end of December the
      gap between the leaders and the club in third never grew beyond five points, and the top spot changed
      hands ten times. Chelsea went top in September after Abramovich's new signings won six of their first nine;
      Manchester United led at Christmas; Arsenal, who drew 0-0 at Old Trafford in September in a game
      remembered for the fight at the end, were never out of the top two. The FA fined Arsenal £175,000
      for that afternoon, the largest fine it had given a club. Nobody yet thought the season would end
      without Arsenal losing.
    caption: Cumulative points, games 1–19, the top three. The shaded band is the gap from first to third.
    source: 'Source: football-data.co.uk; standings by date, 3/1/0, ties on GD then GF.'
    design:
      - Same line weights and colours as the intro race so the reader recognises the zoom.
      - The shaded band in draw-grey at 30%, under the lines.
    checks:
      - The £175,000 fine is from events.csv (not yet hand-verified).

  - id: L05
    competition: Premier League
    chapter: 2003-10
    template: comparison
    form: scatter
    beat: b-shots
    kicker: October · Shooting
    headline: Liverpool shot more than anyone and finished 30 points behind
    stat: { value: '558', label: 'Liverpool’s league shots, the most of any club' }
    chart:
      data: [epl_table_final.csv]
      encode: 'Left page: x = shots, y = goals, one dot per club. Right page: the same clubs ranked by goals per shot on target (bars).'
      highlight: Liverpool accent, Arsenal second; the other 18 muted with direct labels for the extremes only (Birmingham fewest shots 328; Bolton and Southampton lowest conversion 0.166).
      annotate:
        - 'Liverpool: 558 shots, 300 on target, 55 goals. Arsenal: 471 shots, 273 on target, 73 goals.'
      notes: Chelsea had the best goals per shot on target (0.275), Arsenal next (0.267).
    body: >-
      Liverpool took 558 league shots in 2003-04, more than any other club and 87 more than Arsenal. They
      put 300 on target, also the most. They scored 55. Arsenal scored 73 from 273 on target, a goal for
      every 3.7, against Liverpool's one in 5.5. Only Chelsea converted better. At the other end, Bolton
      took 533 shots, the second-highest total, and scored 48. Gérard Houllier's side finished fourth, 30
      points behind the champions, and he was sacked in May. The numbers are a reminder that shooting a lot
      and shooting well are different things.
    caption: Shots and goals for every club (left), and goals per shot on target (right). Liverpool and Arsenal highlighted.
    source: 'Source: football-data.co.uk match statistics.'
    design:
      - One visual in two halves per the comparison template; the scatter axes start at zero.
      - Dot labels in Label style, placed to avoid the leader lines.
    checks:
      - Houllier's sacking (24 May 2004) is from events.csv.

  # ------------------------------------------------------------------ November
  - id: U03
    competition: Champions League
    chapter: 2003-11
    template: hero
    form: bar
    beat: b-eight-three
    kicker: November · Champions League groups
    headline: The group stage averaged two and a half goals a game. In Monaco one night there were eleven
    stat: { value: '8–3', label: 'Monaco v Deportivo, 5 November 2003' }
    chart:
      data: [ucl_matches.csv]
      encode: A histogram of the 96 group games by total goals (0 to 11). Each game is one stacked unit, so the 8–3 stands alone at 11.
      highlight: The 8–3 in accent; Juventus 7–0 Olympiacos (7 goals) in second; everything else muted.
      annotate:
        - '“2.48 goals a game across 96 group matches.”'
        - '“Deportivo conceded eight — and reached the semi-finals.”'
      notes: 'Distribution: 0 goals 7 games, 1: 22, 2: 26, 3: 22, 4: 8, 5: 6, 6: 3, 7: 1, 11: 1.'
    body: >-
      The 96 games of the 2003-04 group stage produced 238 goals, a little under two and a half a game. Seven
      finished 0-0. Only one went past seven. On 5 November in Monaco, Didier Deschamps' side beat Deportivo
      La Coruña 8-3, the highest-scoring game the Champions League had seen. Dado Pršo scored four. The odd
      thing is what happened next: Deportivo, who had beaten Monaco 1-0 in Spain a fortnight earlier, still
      finished second in the group, knocked out Juventus and the holders Milan, and reached the semi-finals.
      Monaco went all the way to the final.
    caption: All 96 group-stage games, by total goals. Each block is one game.
    source: 'Source: engsoccerdata (jalapic) Champions League results.'
    design:
      - The chart region (x 3.75–12) holds 12 columns of blocks; the gap between 7 and 11 is part of the story, keep the empty columns.
      - Annotation leader from the 11 column to the second note.
    checks:
      - '“Highest-scoring game the Champions League had seen”, Pršo’s four goals and Deschamps as Monaco coach are not in our data: confirm against UEFA records.'

  - id: U04
    competition: Champions League
    chapter: 2003-11
    template: breather
    form: big-number
    beat: b-eight-three
    kicker: November
