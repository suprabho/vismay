    beat: b-henry
    kicker: April · Thierry Henry
    headline: Henry scored 30 league goals from 23.9 expected, seven of them in eight April days
    stat: { value: '30', label: 'League goals, from 194 shots worth 23.9 xG' }
    chart:
      data: [epl_top_scorer_shots.csv]
      encode: Half-pitch shot map (StatsBomb 120 × 80, attacking right), every Henry league shot; dot area = xG, filled = goal, open = no goal.
      highlight: Goals filled in accent; the seven April goals (3 v Liverpool 9 Apr, 4 v Leeds 16 Apr) ringed in second.
      annotate:
        - '7 penalties, 3 direct free kicks, 20 from open play.'
        - 'Next best in the league: Shearer 22, Saha and Van Nistelrooy 20.'
      notes: Coordinates are from the shooting team’s view; flip nothing.
    body: >-
      Thierry Henry took 194 league shots in 2003-04, worth 23.9 expected goals by StatsBomb's model, and
      scored 30. Seven were penalties and three free kicks; twenty came from open play. No one else in the
      league scored more than Alan Shearer's 22. Henry's April was the season in miniature. On Good Friday,
      9 April, Liverpool led twice at Highbury and he scored a hat-trick; a week later he scored four against
      Leeds. Seven goals in eight days, as Arsenal came out of a fortnight in which they had gone out of the
      FA Cup and the Champions League. He was voted the footballer of the year by players and writers.
    caption: Every league shot by Thierry Henry in 2003-04. Dot size is the chance's expected-goals value; filled dots are goals; ringed dots came in April.
    source: 'Source: StatsBomb open data (Arsenal 2003/04); goals cross-checked with Wikipedia. StatsBomb logo and credit required.'
