# Story config — vizmaya-studio
#
# The studio manifesto ("Process · What we believe · Who we are") rebuilt as a
# deck-format scrollytelling piece. Bone-white editorial: type on paper, no
# frosted-glass panels, no aura motion.
#
# SHOW, DON'T TELL: a studio that says "we start with the dataset" has to
# show one. The Process beats analyse OUR OWN WORK — the 33 listed vizmaya-fyi
# stories (stories table, 2026-09-29): sections × words per story → the five
# company decks stand out → "maps show, decks explain" (median 54 vs 185 words
# per section). Charts in charts/process-*.json; re-derive if the list grows.
#
# THE PROP: the Penrose tri-mark (three worlds + the leaps between them),
# recoloured to the story palette as static SVGs in
# the story-assets bucket (assets://vizmaya-studio/…; sources + generator in
# content/stories/vizmaya-studio/images/, generated from
# public/vizmaya-logo-01.svg geometry). Green = Pattern, vermillion = Meaning,
# indigo = Form. It fills the left panel of every title slide, recast as the
# studio on "Studio". The animated wordmark (vizmaya-logo.riv) bookends the
# deck on the cover and closing. The persistent top-left logo re-tints per
# section via `logoPalette`.

defaults:
  mapStyle: mapbox://styles/mapbox/light-v11
  mapOpacity: 0
  pinColor: "#2d6a4f"
  pinRadius: 10
  flySpeed: 1.2

  # Flat bone backdrop — no aura motion. The mark and the type carry the page.
  storyBackground:
    type: color
    value: "#f5f1ea"
  overlay:
    color: "transparent"
    opacity: 0

  # Panels OFF — editorial wants type on paper, not cards on glass.
  panel:
    background: "transparent"
    border: "none"
    borderRadius: "0"
    padding: "0"
    backdropBlur: "0"
    shadow: "none"

  scroll:
    mode: snap
    paddingY: "12vh"

  # Right-edge step indicator (one hairline per slide).
  progress: true

  # Persistent top-left logo base palette. The mark keeps its tri-colour
  # identity (teal=green, accent=vermillion, accent2=indigo); each section
  # layers its own accent shift on top.
  logoPalette:
    accent: "$red"        # vermillion accent by default
    accent2: "$accent2"   # indigo
    teal: "$teal"         # green

sections:

  # ── 1 · COVER — title + dek on the right, animated wordmark on the left ────
  - id: cover
    kind: hero
    text: "Cover"
    heading: "We give the invisible its shape."
    eyebrow: "— Vismaya · a data-storytelling studio"
    background:
      type: none
    foreground:
      - type: rive
        src: "/vizmaya-logo.riv"
        autoplay: true
        layout: { fit: contain, alignment: center }
        viewModel:
          bindings:
            textColor:    "#0f0e0c"
            tealColor:    "#2d6a4f"
            accentColor:  "#c4391c"
            accent2Color: "#5c4ba0"
            surfaceColor: "#f5f1ea"
            mutedColor:   "#6b665d"
            lineColor:    "#d8d2c5"
        capture: { mode: currentFrame }
        style:
          position: { x: left, y: center }
          size: { width: "32%", height: "40vh" }
          portrait: { position: { x: center, y: "22%" }, size: { width: "80%", height: "24vh" } }

  # ── 2 · PROCESS — title slide; the three worlds, labelled ──────────────────
  - id: process
    kind: hero
    text: "Process"
    heading: "Three things. In order. Every time."
    eyebrow: "— Process"
    background:
      type: none
    foreground:
      - type: image
        src: "assets://vizmaya-studio/mark-three-worlds.svg"
        alt: "The Vismaya mark: three circles labelled Pattern (the data), Meaning (the mind) and Form (the design), joined by tapering leaps."
        fit: contain
        style:
          position: { x: left, y: center }
          size: { width: "32%", height: "62vh" }
          portrait: { position: { x: center, y: "24%" }, size: { width: "78%", height: "34vh" } }

  # ── 3–5 · PATTERN → MEANING → FORM — one dataset, three passes ────────────
  # Same data (our 33 published stories) in all three charts; only what
  # we've understood changes. Mark node + logo tint follow the step.
  - id: pattern
    kind: split
    text: "Pattern"
    layout: text-left-chart-right
    logoPalette:
      accent: "$teal"
    foreground:
      - type: image
        src: "assets://vizmaya-studio/mark-pattern.svg"
        alt: "The mark with the Pattern circle filled in green."
        fit: contain
        style:
          position: { x: right, y: "2%" }
          size: { width: "6%", height: "9vh" }
          portrait: { opacity: 0 }
      - type: bodyText
        from: text
        showHeading: true
        heading: "01 — Data · Pattern"
        textStyle:
          size: large
        style:
          position: { x: left, y: center }
          size: { width: "34%" }
      - type: chart
        id: process-pattern
        style:
          position: { x: right, y: center }
          size: { width: "54%", height: "62vh" }
          portrait: { size: { height: "34vh" } }

  - id: meaning
    kind: split
    text: "Meaning"
    layout: text-left-chart-right
    logoPalette:
      accent: "$red"
    foreground:
      - type: image
        src: "assets://vizmaya-studio/mark-meaning.svg"
        alt: "The mark with the Meaning circle filled in vermillion."
        fit: contain
        style:
          position: { x: right, y: "2%" }
          size: { width: "6%", height: "9vh" }
          portrait: { opacity: 0 }
      - type: bodyText
        from: text
        showHeading: true
        heading: "02 — Narrative · Meaning"
        textStyle:
          size: large
        style:
          position: { x: left, y: center }
          size: { width: "34%" }
      - type: chart
        id: process-meaning
        style:
          position: { x: right, y: center }
          size: { width: "54%", height: "62vh" }
          portrait: { size: { height: "34vh" } }

  - id: form
    kind: split
    text: "Form"
    layout: text-left-chart-right
    logoPalette:
      accent: "$accent2"
    foreground:
      - type: image
        src: "assets://vizmaya-studio/mark-form.svg"
        alt: "The mark with the Form circle filled in indigo."
        fit: contain
        style:
          position: { x: right, y: "2%" }
          size: { width: "6%", height: "9vh" }
          portrait: { opacity: 0 }
      - type: bodyText
        from: text
        showHeading: true
        heading: "03 — Design · Form"
        textStyle:
          size: large
        style:
          position: { x: left, y: center }
          size: { width: "34%" }
      - type: chart
        id: process-form
        style:
          position: { x: right, y: center }
          size: { width: "54%", height: "62vh" }
          portrait: { size: { height: "34vh" } }

  # ── 6 · THE MARK — the Penrose explanation next to the labelled mark ───────
  - id: the-mark
    kind: split
    text: "The mark"
    layout: text-left-chart-right
    foreground:
      - type: bodyText
        from: text
        showHeading: true
        heading: "Our mark"
        textStyle:
          size: large
        style:
          position: { x: left, y: center }
          size: { width: "44%" }
      - type: image
        src: "assets://vizmaya-studio/mark-three-worlds.svg"
        alt: "The Vismaya mark: Pattern, Meaning and Form as three circles joined by leaps, after Roger Penrose's three-worlds diagram."
        fit: contain
        style:
          position: { x: right, y: center }
          size: { width: "42%", height: "70vh" }

  # ── 7 · BELIEF — title slide; rigour + beauty drawn as one line ────────────
  # Art: images/make_belief.py over images/portfolio-2026-09-29.json.
  - id: belief
    kind: hero
    text: "Belief"
    heading: "Rigour and beauty are the same demand."
    eyebrow: "— What we believe"
    background:
      type: none
    foreground:
      - type: image
        src: "assets://vizmaya-studio/belief.svg"
        alt: "Rigour and beauty in one drawing: all 33 of our published stories measured on a drafting grid by words per section, with one smooth vermillion line drawn through every point."
        fit: contain
        style:
          position: { x: left, y: center }
          size: { width: "33%", height: "70vh" }
          portrait: { position: { x: center, y: "22%" }, size: { width: "80%", height: "36vh" } }

  # ── 8 · WHAT THE WORLD HIDES — thesis left, three hidden things right ──────
  - id: world-hides
    kind: bodyText
    text: "What the world hides"
    paragraphs: [0, 1]
    foreground:
      - type: bodyText
        from: text
        showHeading: true
        heading: "What the world hides"
        textStyle:
          size: large
        style:
          position: { x: left, y: center }
          size: { width: "40%" }
      - type: keyValue
        title: "Hiding in plain sight"
        items:
          - { key: "The supply chain", value: "6 countries, 1 chokepoint most people can't name", color: teal }
          - { key: "The policy shift", value: "In an appendix, unread", color: red }
          - { key: "The slow variable", value: "In the dataset, ignored", color: accent2 }
        listStyle: { layout: stacked, size: lg, gap: loose }
        style:
          position: { x: right, y: center }
          size: { width: "40%" }
          revealDelayMs: 250

  # ── 9 · BOTH FAIL — the two failure modes, then the verdict ────────────────
  - id: both-fail
    kind: quote
    text: "Both fail the same way"
    # Two short side-by-side lists (not one tall stack) so nothing can grow
    # into the verdict below on short frames like the home-page embed.
    foreground:
      - type: keyValue
        items:
          - { key: "Either", value: "It stays buried in jargon", color: muted }
        listStyle: { layout: stacked, size: lg, valueFontSize: "clamp(1.4rem, 2.4vw, 2.2rem)", keyFontSize: "0.85rem" }
        style:
          position: { x: "16%", y: "24%" }
          size: { width: "32%" }
          portrait: { position: { x: "0%", y: "8%" }, size: { width: "100%" } }
      - type: keyValue
        items:
          - { key: "Or", value: "It gets compressed into a hot take", color: muted }
        listStyle: { layout: stacked, size: lg, valueFontSize: "clamp(1.4rem, 2.4vw, 2.2rem)", keyFontSize: "0.85rem" }
        style:
          position: { x: "54%", y: "24%" }
          size: { width: "32%" }
          portrait: { position: { x: "0%", y: "30%" }, size: { width: "100%" } }
      - type: quote
        text: "Both fail the same way."
        align: center
        style:
          position: { x: center, y: "62%" }
          size: { width: "72%" }
          portrait: { position: { x: center, y: "64%" }, size: { width: "100%" } }
          revealDelayMs: 400

  # ── 10 · WHAT WE MAKE — the thesis next to real work in three formats ──────
  - id: what-we-make
    kind: bodyText
    text: "What we make"
    paragraphs: [0, 2]
    mobileParagraphs:
      - [0, 1]
      - [1, 2]
    foreground:
      - type: bodyText
        from: text
        showHeading: true
        heading: "What we make"
        style:
          position: { x: left, y: center }
          size: { width: "34%" }
      - type: image
        src: "assets://vizmaya-studio/what-we-make.webp"
        alt: "Three formats from our own work: a stack of scrollytelling slides from Up and down the peninsula, a single bar chart from What a Litre Costs in India, and a 9:16 phone frame from The Last Forest Before the Strait."
        fit: contain
        style:
          position: { x: right, y: center }
          size: { width: "60%", height: "72vh" }
          portrait: { size: { width: "100%", height: "34vh" } }

  # ── 11 · STUDIO — title slide; the mark recast as two people + the story ───
  - id: studio
    kind: hero
    text: "Studio"
    heading: "A two-person studio."
    eyebrow: "— Who we are"
    background:
      type: none
    foreground:
      - type: image
        src: "assets://vizmaya-studio/mark-studio.svg"
        alt: "The mark recast: Shashank (words, data) and Suprabho (design, code) as two circles, the story they make as the third."
        fit: contain
        style:
          position: { x: left, y: center }
          size: { width: "32%", height: "62vh" }
          portrait: { position: { x: center, y: "24%" }, size: { width: "78%", height: "34vh" } }

  # ── 12 · SHASHANK — bio left, fact sheet right ─────────────────────────────
  - id: shashank
    kind: bodyText
    text: "Shashank A. Pandey"
    mobileParagraphs:
      - [0, 1]
      - [1, 2]
    foreground:
      - type: bodyText
        from: text
        showHeading: true
        heading: "Shashank A. Pandey"
        style:
          position: { x: left, y: center }
          size: { width: "50%" }
      - type: keyValue
        items:
          - { key: "Practice", value: "Data storytelling, visual journalism", color: teal }
          - { key: "Path", value: "Journalist → designer → researcher, self-taught", color: muted }
          - { key: "Believes", value: "Clarity is an act of generosity", color: red }
        listStyle: { layout: stacked, gap: loose }
        style:
          position: { x: right, y: center }
          size: { width: "32%" }
          portrait: { opacity: 0 }

  # ── 13 · SUPRABHO — bio left, fact sheet right ─────────────────────────────
  - id: suprabho
    kind: bodyText
    text: "Suprabho Dhenki"
    mobileParagraphs:
      - [0, 1]
      - [1, 2]
    foreground:
      - type: bodyText
        from: text
        showHeading: true
        heading: "Suprabho Dhenki"
        style:
          position: { x: left, y: center }
          size: { width: "50%" }
      - type: keyValue
        items:
          - { key: "Practice", value: "Product design, creative technology", color: accent2 }
          - { key: "Now", value: "Founder, Promad", color: muted }
          - { key: "Before", value: "Microsoft · 1mg · ClearTax · Merkle Science · Kidzovo", color: muted }
          - { key: "Research", value: "CHI publication, IIT Guwahati", color: muted }
        listStyle: { layout: stacked, gap: loose }
        style:
          position: { x: right, y: center }
          size: { width: "32%" }
          portrait: { opacity: 0 }

  # ── 14 · CLOSING — the mark returns; the line sits clear of it ─────────────
  - id: closing
    kind: closing
    layout: centered
    text: "Closing"
    foreground:
      - type: rive
        src: "/vizmaya-logo.riv"
        autoplay: true
        layout: { fit: contain, alignment: center }
        viewModel:
          bindings:
            textColor:    "#0f0e0c"
            tealColor:    "#2d6a4f"
            accentColor:  "#c4391c"
            accent2Color: "#5c4ba0"
            surfaceColor: "#f5f1ea"
            mutedColor:   "#6b665d"
            lineColor:    "#d8d2c5"
        capture: { mode: currentFrame }
        style:
          position: { x: center, y: "36%" }
          size: { width: "40%", height: "30vh" }
      - type: quote
        text: "We added the z for viz. That's the job."
        align: center
        style:
          position: { x: center, y: "72%" }
          size: { width: "64%" }
          revealDelayMs: 300
