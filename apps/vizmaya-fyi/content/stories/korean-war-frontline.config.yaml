# Story config — korean-war-frontline
#
# Source: research brief "Up and down the peninsula — the Korean War's moving
# frontline" (Vizmaya, September 2026). Twelve positions of one line, June 1950
# to July 1953, plus the share of the peninsula north of each line.
#
# Custom GeoJSON (built for this story):
#   /data/korean-war-frontlines.geojson  — idProperty "id"
#     held-<beat>   land north of the line (communist-held), closed along the
#                   coast + Yalu so the fill follows the line exactly
#     front-<beat>  ±2.5 km strip along the line itself, clipped to land
#     parallel-38   the 38th parallel reference strip (same geometry as
#                   front-parallel; stable id so every section can show it)
#   beats: parallel july50 pusan oct50 nov50 dec50 jan51 apr51 may51 jun51
#          stalemate armistice
#   Source of record + build script: vizmaya-data/korean-war-frontline/
#   (frontlines.csv → scripts/build-geojson.mjs). Swap in better geometry
#   there; nothing in this file changes.
#
# Layer recipe per beat:
#   held-<beat>     brick fill      #9B3B2E @ 0.42
#   front-<beat>    brick strip     #C24C3B @ 0.95   (the line itself)
#   front-<prev>    stone strip     #DCD5C3 @ 0.35   (ghost of the previous line)
#   parallel-38     gold strip      #E0B25A @ 0.85   (reference, every section)
#
# Reference coordinates (lng, lat):
#   Seoul     126.978 37.566   Pyongyang 125.754 39.039   Pusan    129.075 35.180
#   Inchon    126.705 37.456   Kaesong   126.554 37.971   Panmunjom 126.677 37.956
#   Chorwon   127.310 38.250   Chosin    127.250 40.500   Hungnam  127.620 39.830
#   Hyesan    128.177 41.400   Chongjin  129.776 41.796   Chosan   125.790 40.830

defaults:
  mapStyle: mapbox://styles/mapbox/dark-v11
  mapOpacity: 0.6
  pinColor: "#E0B25A"
  pinRadius: 7
  flySpeed: 1.1
  mapPalette:
    land: "#2B3944"
    water: "#1B252E"
    border: "#4A5A66"
    labelText: "#C9C2B2"
    labelHalo: "#1B252E"

# Camera presets (the prose rail sits on the right 63vw, so desktop centers
# sit east of the peninsula to keep it in the open left third):
#   full peninsula  desktop [130.4, 38.4] z5.5   mobile [127.4, 38.0] z4.9
#   central front   desktop [128.9, 38.15] z7.2  mobile [127.5, 38.15] z6.5

sections:

  # ── HERO ─────────────────────────────────────────
  - id: hero
    kind: hero
    text: "Up and down the peninsula"
    eyebrow: "Korean War · June 1950 – July 1953 · The moving frontline"
    map:
      center: [130.4, 38.4]
      zoom: 5.5
      pitch: 10
      bearing: 0
      opacity: 0.55
      mobile:
        center: [127.4, 38.0]
        zoom: 4.9
      regions:
        level: custom
        geojsonUrl: "/data/korean-war-frontlines.geojson"
        idProperty: "id"
        lineColor: "#E0B25A"
        lineWidth: 0.4
        items:
          - { code: "parallel-38", color: "#E0B25A", opacity: 0.85 }
      textLabels:
        - { coordinates: [126.978, 37.566], text: "Seoul", anchor: right }
        - { coordinates: [125.754, 39.039], text: "Pyongyang", anchor: right }
        - { coordinates: [129.075, 35.180], text: "Pusan", anchor: right }

