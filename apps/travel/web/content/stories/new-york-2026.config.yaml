# Day-3 scrapbook story config. Coordinates are [lng, lat] (Mapbox order).
#
# Each spread = one section: a lean map camera + a `scrapbook:` block.
# Photos flow in at render time from curated media (travel_trip_media via
# /curate; git manifest fallback) — see apps/travel/web/lib/scrapbookLayers.ts.
# Hand-authored `foreground.regions` win over injection per region.
#
# The journey map view reads <slug>.trip.yaml (all 4 days) — untouched by this.
defaults:
  mapStyle: mapbox://styles/mapbox/light-v11
  mapOpacity: 0.55
  pinColor: "#2ca068"
  pinRadius: 8
  flySpeed: 0.9
sections:
  - id: cover
    kind: hero
    text: New York
    eyebrow: 🗽 Day Three · Mar 14, 2026
    layout: hero-full-bleed
    map:
      center: [-73.982, 40.76]
      zoom: 11.6
      pitch: 30
      bearing: 0
      opacity: 0.85
      mobile:
        zoom: 10.8
    foreground:
      - type: image
        src: assets://new-york-2026/d3-dumbo-piers-manhattan-skyline-03.jpg
        fit: cover
        priority: true

  - id: walk-the-brooklyn-bridge
    text: Walk the Brooklyn Bridge
    scrapbook: { stop: walk-the-brooklyn-bridge, template: hero }
    map:
      center: [-73.9969, 40.7061]
      zoom: 15.2
      pitch: 40

  - id: dumbo-piers-manhattan-skyline
    text: DUMBO Piers — Manhattan Skyline
    scrapbook: { stop: dumbo-piers-manhattan-skyline, template: scatter }
    map:
      center: [-73.9956, 40.703]
      zoom: 15.4
      pitch: 40
      bearing: -20

  - id: gleasons-gym
    text: Gleasons Gym
    scrapbook: { stop: gleasons-gym, template: note }
    map:
      center: [-73.9787, 40.6945]
      zoom: 15.2
      pitch: 40

  - id: katzs-delicatessen
    text: "Katz's Delicatessen"
    scrapbook: { stop: katzs-delicatessen, template: ticket }
    layout: travel:spread-center
    map:
      center: [-73.9874, 40.7223]
      zoom: 15.2
      pitch: 40
    foreground:
      layout: travel:spread-center
      regions:
        content:
          - type: travel:ticket
            title: "KATZ'S DELICATESSEN"
            venue: 205 E Houston St
            time: 9:00 AM
            line: "No. 47 · pastrami on rye · matzo ball soup"
            price: "$27.45"
            stampText: ADMIT ONE
            color: "#2ca068"
            rotation: -2
            style:
              position: { x: center, y: 6% }
              size: { width: 100%, height: 40% }
              portrait: { size: { height: 30vh } }
          - type: bodyText
            style:
              position: { x: center, y: 50% }
              size: { width: 92%, height: 26% }
              panel:
                background: "rgba(253, 252, 248, 0.94)"
                border: 1px solid var(--color-line)
                borderRadius: 3px
                padding: 1.25rem
                shadow: 0 10px 30px rgba(20, 16, 8, 0.18)
              portrait: { size: { height: 26vh } }
          - type: travel:tapeNote
            title: "SUPRABHO'S PICK"
            text: "split one sandwich. trust us — they're massive."
            rotation: 2
            enterDelay: 200
            style:
              position: { x: center, y: 80% }
              size: { width: 88%, height: 20% }
              portrait: { size: { height: 16vh } }

  - id: the-high-line
    text: The High Line
    scrapbook: { stop: the-high-line, template: hero }
    map:
      center: [-74.0048, 40.748]
      zoom: 15
      pitch: 40
      bearing: 15

  - id: the-edge-hudson-yards
    text: The Edge, Hudson Yards
    scrapbook: { stop: the-edge-hudson-yards, template: scatter }
    map:
      center: [-74.0011, 40.7534]
      zoom: 15.6
      pitch: 55

  - id: how-i-met-your-mother-mcgees-pub
    text: How I Met Your Mother — McGee's Pub
    scrapbook: { stop: how-i-met-your-mother-mcgees-pub, template: grid }
    map:
      center: [-73.9814, 40.7642]
      zoom: 15.2
      pitch: 40

  - id: museum-of-modern-art-moma
    text: Museum of Modern Art (MoMA)
    scrapbook: { stop: museum-of-modern-art-moma, template: stack, max: 5 }
    map:
      center: [-73.9776, 40.7614]
      zoom: 15.2
      pitch: 40

  - id: moma-clips
    text: The MoMA Clips
    scrapbook:
      stop: museum-of-modern-art-moma
      template: scatter
      offset: 5
      max: 2
      video: true
      tip: false
    map:
      center: [-73.9776, 40.7614]
      zoom: 15.6
      pitch: 40
      bearing: 30

  - id: rockefeller-center-lego-store
    text: Rockefeller Center & LEGO Store
    scrapbook: { stop: rockefeller-center-lego-store, template: grid }
    map:
      center: [-73.9787, 40.7587]
      zoom: 15.2
      pitch: 40

  - id: grand-central-terminal
    text: Grand Central Terminal
    scrapbook: { stop: grand-central-terminal, template: stack, max: 5 }
    map:
      center: [-73.9772, 40.7527]
      zoom: 15.2
      pitch: 50

  - id: the-metropolitan-museum-of-art
    text: The Metropolitan Museum of Art
    scrapbook: { stop: the-metropolitan-museum-of-art, template: hero }
    map:
      center: [-73.9632, 40.7794]
      zoom: 15.4
      pitch: 40

  - id: met-second-wind
    text: The MET — Second Wind
    scrapbook:
      stop: the-metropolitan-museum-of-art
      template: stack
      offset: 1
      max: 5
      tip: false
    map:
      center: [-73.9632, 40.7794]
      zoom: 15.6
      pitch: 40
      bearing: 40

  - id: guggenheim-museum
    text: Guggenheim Museum
    scrapbook: { stop: guggenheim-museum, template: scatter, video: true }
    map:
      center: [-73.959, 40.783]
      zoom: 15.4
      pitch: 40

  - id: central-park
    text: Central Park
    scrapbook: { stop: central-park, template: hero, video: true }
    map:
      center: [-73.9656, 40.7826]
      zoom: 14.6
      pitch: 45

  - id: golden-hour
    text: Golden Hour in the Park
    scrapbook:
      stop: central-park
      template: scatter
      offset: 30
      tip: false
    map:
      center: [-73.9712, 40.7769]
      zoom: 15
      pitch: 45
      bearing: -15

  - id: days-end
    text: "Day's End"
    layout: travel:spread-center
    map:
      center: [-73.982, 40.76]
      zoom: 11.2
      pitch: 20
    foreground:
      layout: travel:spread-center
      regions:
        content:
          - type: bodyText
            style:
              position: { x: center, y: 10% }
              size: { width: 92%, height: 34% }
              panel:
                background: "rgba(253, 252, 248, 0.94)"
                border: 1px solid var(--color-line)
                borderRadius: 3px
                padding: 1.5rem
                shadow: 0 10px 30px rgba(20, 16, 8, 0.18)
              portrait: { size: { height: 30vh } }
          - type: travel:tapeNote
            title: UNTIL NEXT TIME
            text: "13 stops · 10.5 hours · 386 photos. see you soon, new york."
            paper: sticky
            rotation: -2
            enterDelay: 250
            style:
              position: { x: center, y: 54% }
              size: { width: 88%, height: 24% }
              portrait: { size: { height: 18vh } }
        meta:
          - type: travel:postmark
            place: New York City
            time: MAR 14
            emoji: 🗽
            enterDelay: 400
            style:
              portrait: { size: { height: 110px } }
