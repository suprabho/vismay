name: Scrape AI Data Centers news

# Daily pull of Google News' RSS search across four AI-infrastructure queries
# (AI data centers, semiconductors, microprocessors, AI infra). Each new
# article is classified by Claude Haiku — relevance gate, topic tags,
# tracked tickers from dc_stocks, plus the daily-snapshot tags (layer, place,
# theme, mood, energy, facts; migration 078) — and upserted into dc_news.
# Idempotent on source_url (off-topic items persist with relevant=false so
# they aren't re-classified), so re-runs and manual dispatches are safe.
#
# Dispatch with backfill_days set to re-tag relevant rows that predate the
# snapshot tags (no feed fetch) — run once after migration 078 so the
# edition's mood sparkline and field baselines have history.
#
# Google News rather than per-publisher scraping for the same reason as
# scrape-energy-profile-news.yml: one free, machine-friendly feed with broad
# outlet coverage that works from any IP.
#
# Required repo secrets (in the `Production` environment so secrets.X resolves):
#   NEXT_PUBLIC_SUPABASE_URL   — same value as Vercel env
#   SUPABASE_SERVICE_ROLE_KEY  — service role key for dc_news writes
#   ANTHROPIC_API_KEY          — Claude Haiku classification
#   AI_GATEWAY_API_KEY         — Jev figure gate (typesafe-ai/jev); optional, fails open

on:
  schedule:
    # 06:45 UTC daily — picks up overnight news before US/EU work hours; the
    # :45 offset avoids the top-of-hour Actions queue spike and staggers off
    # the 06:15 energy-profile scrape so the two never share a Gemini window.
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Re-tag untagged relevant rows from the last N days instead of scraping'
        required: false
        default: ''
      retag_days:
        description: 'Re-tag rows classified by an older classifier version from the last N days instead of scraping (run once after a classifier change)'
        required: false
        default: ''

concurrency:
  group: scrape-ai-data-centers-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    defaults:
      run:
        working-directory: apps/vizmaya-fyi

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scrape AI Data Centers news
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: >
          pnpm ai-data-centers:scrape-news
          ${{ github.event.inputs.backfill_days != '' && format('-- --backfill-days {0}', github.event.inputs.backfill_days) || '' }}
          ${{ github.event.inputs.retag_days != '' && format('-- --retag-days {0}', github.event.inputs.retag_days) || '' }}
