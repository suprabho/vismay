name: Render HTML story audio

# Section-wise narration for an agent-authored HTML story. Dispatched with
# `workflow_dispatch` by hand only, from the admin editor's Section audio
# panel (Generate audio; Regenerate all with force=true; see
# packages/html-stories/src/audio.ts). Publishing never dispatches it. Runs
# packages/html-stories/scripts/generate-audio.ts, which voices each section
# whose text changed and writes the manifest to html_story_audio
# (migration 097).
#
# Required repo secrets (under the `Production` environment, shared with the
# other render workflows):
#   NEXT_PUBLIC_SUPABASE_URL    — same value as in Vercel env
#   SUPABASE_SERVICE_ROLE_KEY   — service role key for storage writes
#   AI_GATEWAY_API_KEY          — Vercel AI Gateway key for TTS (Gemini TTS via the gateway)
#   ELEVENLABS_API_KEY          — optional; when set, ElevenLabs narrates instead of Gemini
#
# Optional repo variables (Settings → Variables) pick the voice
# (packages/html-stories/src/narrationVoice.ts):
#   HTML_STORY_AUDIO_PROVIDER   — elevenlabs | gemini (default: elevenlabs when its key is set)
#   HTML_STORY_AUDIO_VOICE      — ElevenLabs voice id, or Gemini voice name (default George / Orus)
#   HTML_STORY_AUDIO_MODEL      — ElevenLabs model id (default eleven_multilingual_v2;
#                                 eleven_flash_v2_5 is half the credits), or a gateway
#                                 speech alias (speech.default, speech.lite)
# Changing any of them re-voices every section on the next run.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: HTML story slug
        required: true
        type: string
      force:
        description: Re-voice every section, even unchanged ones
        required: false
        type: boolean
        default: false

concurrency:
  group: html-story-audio-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    defaults:
      run:
        working-directory: packages/html-stories

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate audio
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HTML_STORY_AUDIO_PROVIDER: ${{ vars.HTML_STORY_AUDIO_PROVIDER }}
          HTML_STORY_AUDIO_VOICE: ${{ vars.HTML_STORY_AUDIO_VOICE }}
          HTML_STORY_AUDIO_MODEL: ${{ vars.HTML_STORY_AUDIO_MODEL }}
          SLUG: ${{ inputs.slug }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: pnpm exec tsx scripts/generate-audio.ts "$SLUG" $FORCE
