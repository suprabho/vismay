name: Ingest AI Data Centers papers

# Daily arXiv pull for the AI Data Centers daily snapshot's research chapter:
# submissions across cs.AI / cs.CL / cs.LG / cs.CV / cs.AR / cs.DC in the
# window, a cheap title-and-abstract keyword gate, then a Claude Haiku gate
# that keeps papers with a data-center-scale or frontier-AI bearing and
# extracts the fields the chapter renders (area, result, scale, released).
# Upserts into dc_papers on arxiv_id (rejects persist with relevant=false),
# so re-runs and manual dispatches are safe.
#
# Runs as the second job of dc-morning-edition.yml, after the news scrape
# and before the edition composer, which reads the window's kept papers.
# The composer tolerates a failed or empty run — the edition ships with an
# empty research chapter and a notice, never misses.
#
# Required repo secrets (in the `Production` environment so secrets.X resolves):
#   NEXT_PUBLIC_SUPABASE_URL   — same value as Vercel env
#   SUPABASE_SERVICE_ROLE_KEY  — service role key for dc_papers writes
#   ANTHROPIC_API_KEY          — Claude Haiku paper gate

on:
  workflow_call:
    inputs:
      hours:
        type: string
        required: false
        default: '36'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Trailing window length in hours (default 36)'
        required: false
        default: '36'

concurrency:
  group: ingest-dc-papers
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    defaults:
      run:
        working-directory: apps/vizmaya-fyi

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ingest arXiv papers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm ai-data-centers:ingest-papers -- --hours ${{ inputs.hours || '36' }}
