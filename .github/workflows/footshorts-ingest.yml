name: Footshorts - hourly news ingest

# Pulls football RSS feeds — plus theanalyst.com, the one approved scraped
# source (SCRAPE_SOURCES in worker/src/sources.ts; policy + verification
# checklist in apps/footshorts/docs/theanalyst-scraping.md) — hands each new
# article to the AI gateway (Jev classifies, Claude Haiku summarises + tags,
# Jev gates the tags), upserts into the footshorts Supabase. Safe to re-run
# (idempotent on url_hash).
#
# Required repo secrets (in `Production` — shared project-wide with vizmaya /
# vizf1 / energy-profile workflows):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   AI_GATEWAY_API_KEY           - Vercel AI Gateway key (Jev + Claude)
#   FOOTBALL_DATA_TOKEN          - football-data.org API token (footshorts-only)

on:
  schedule:
    # Every hour on the hour. GH cron is UTC and can drift up to ~15 min under load.
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: footshorts-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Runs normally finish in ~10 min; headroom for a backlog hour (capped per
    # source in ingest.ts) so a slow gateway doesn't kill a run mid-batch.
    timeout-minutes: 30
    environment: Production
    defaults:
      run:
        working-directory: apps/footshorts/worker

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: pnpm ingest:ci
