name: Footshorts - theanalyst match facts

# Scrapes Opta match facts from theanalyst.com's match centre
# (worker/src/theanalystMatchFacts.ts) for recently finished fixtures:
# first resolves theanalyst matchIds onto fixtures rows (by team names +
# kickoff date, persisted so it's a one-time cost per fixture), then upserts
# per-side stats into `opta_match_facts` on (fixture_id, side) — idempotent,
# safe to re-run.
#
# SEPARATE from footshorts-scores.yml / footshorts-events-sr.yml on purpose
# (same principle that split recaps out of scores): a scrape failure must not
# fail the score refresh, and this job doesn't touch their rate-limited API
# budgets so it doesn't join the footshorts-football-data lock. But match
# facts only exist once a fixture is status='finished', which the scores
# refresh flips every 3 hours — so this runs on the same 3-hour cadence,
# offset 30 minutes later, so freshly-finished fixtures are already visible.
#
# Discovery + scrape selectors verified end-to-end against the live site
# 2026-08-24 (docs/theanalyst-scraping.md) — discovery drives the fixtures
# page's date-picker calendar with headless Chromium (there's no listing URL),
# competitionId/seasonId are read live from what it finds rather than
# hand-curated. Still untested: the actual Supabase write path — run via
# workflow_dispatch --dry, then for real, before trusting the schedule.
#
# Required repo secrets (in `Production` — shared project-wide):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# (No Gemini key — the scrape is deterministic parsing.)

on:
  schedule:
    # 30 min after footshorts-scores.yml's 3-hourly refresh. GH cron is UTC
    # and can drift up to ~15 min under load.
    - cron: '30 */3 * * *'
  workflow_dispatch:
    inputs:
      competition:
        description: 'Competition slug to limit to (e.g. premier-league). Blank = all tracked.'
        required: false
        type: string
        default: ''
      fixture_id:
        description: 'Fixture id (uuid) to limit to — requires competition to also be set. Blank = normal competition-wide run.'
        required: false
        type: string
        default: ''
      dry:
        description: 'Discover + scrape + print, no Supabase writes.'
        required: false
        type: boolean
        default: false
      dump_events:
        description: 'Print the widget''s Opta class inventory + unparsed DOM regions per page (event-selector debugging).'
        required: false
        type: boolean
        default: false
      events_backfill:
        description: 'Also re-scrape stats-done fixtures that lack fixture_events rows (budget-capped).'
        required: false
        type: boolean
        default: false

concurrency:
  group: footshorts-theanalyst-match-facts
  cancel-in-progress: false

jobs:
  match-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    defaults:
      run:
        working-directory: apps/footshorts/worker

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .

      # Match discovery + the match-centre stats widget are client-rendered —
      # both go through headless Chromium, not plain fetch.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Scrape match facts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Read inputs via env (not direct ${{ }} interpolation) to avoid shell injection.
          INPUT_COMPETITION: ${{ inputs.competition }}
          INPUT_FIXTURE_ID: ${{ inputs.fixture_id }}
          INPUT_DRY: ${{ inputs.dry }}
          INPUT_DUMP_EVENTS: ${{ inputs.dump_events }}
          INPUT_EVENTS_BACKFILL: ${{ inputs.events_backfill }}
        run: |
          ARGS=()
          [ -n "$INPUT_COMPETITION" ] && ARGS+=("--competition=$INPUT_COMPETITION")
          [ -n "$INPUT_FIXTURE_ID" ] && ARGS+=("--fixture-id=$INPUT_FIXTURE_ID")
          [ "$INPUT_DRY" = "true" ] && ARGS+=("--dry")
          [ "$INPUT_DUMP_EVENTS" = "true" ] && ARGS+=("--dump-events")
          [ "$INPUT_EVENTS_BACKFILL" = "true" ] && ARGS+=("--events-backfill")
          pnpm match-facts:ci -- "${ARGS[@]}"
