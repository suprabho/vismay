name: Footshorts - ad-hoc recap

# AD-HOC footshorts recaps only (worker/src/recap.ts): a rolling "last X hours"
# editorial brief inserted as a snapshot into the `daily_recaps` table, filtered
# by window / competition / team (e.g. "just Real Madrid's last 12h"). Driven
# manually from the admin Recaps tab (see packages/content-source/src/recapDispatch.ts,
# which dispatches this file by name) or from the Actions tab.
#
# The twice-daily schedule (00:00 / 12:00 UTC) was RETIRED — the automatic recap
# is no longer generated. Retired alongside it were the two event-hydration steps
# that rode on that cron:
#
#   • `pnpm events:ci`    — API-Football per-match goal events
#   • `pnpm events:sr:ci` — Sportradar World Cup timelines
#
# Neither was rehomed, so `fixture_events` no longer has a scheduled writer.
# Sportradar backfills remain available on demand via footshorts-events-sr.yml;
# the API-Football sync now has no workflow at all and must be run locally
# (`pnpm events`) if that data is wanted again.
#
# recap.ts covers a trailing window ending now (default 24h) and includes only
# fixtures that have finished within it; it no-ops if none have. Each run inserts
# a new snapshot row, so re-runs add to the timeline rather than overwriting.
# It reads whatever events are already stored — it does not fetch them.
#
# Required repo secrets (in `Production` — shared project-wide):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   GEMINI_API_KEY               - Google AI Studio key, for the recap narrative
#
# (API_FOOTBALL_TOKEN / SPORTRADAR_API_KEY are no longer read by this workflow.)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Window length in hours (trailing window ending now). Blank = 24.'
        required: false
        type: string
        default: ''
      competition:
        description: "Competition slug to filter on (e.g. premier-league, la-liga). 'all' = every competition."
        required: false
        type: string
        default: 'all'
      team:
        description: 'Team slug to filter on (e.g. real-madrid). Blank = no team filter.'
        required: false
        type: string
        default: ''

concurrency:
  # Recap-only: no external football API is called, so there's nothing to
  # serialise against scores / fixtures / events-sr. Key by filter combination so
  # independent ad-hoc recaps don't cancel each other.
  group: footshorts-recap-${{ inputs.competition }}-${{ inputs.team }}
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    defaults:
      run:
        working-directory: apps/footshorts/worker

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate recap (ad-hoc)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Read inputs via env (not direct ${{ }} interpolation) to avoid shell injection.
          INPUT_HOURS: ${{ inputs.hours }}
          INPUT_COMPETITION: ${{ inputs.competition }}
          INPUT_TEAM: ${{ inputs.team }}
        run: |
          ARGS=()
          [ -n "$INPUT_HOURS" ] && ARGS+=("--hours=$INPUT_HOURS")
          [ -n "$INPUT_COMPETITION" ] && [ "$INPUT_COMPETITION" != "all" ] && ARGS+=("--scope=$INPUT_COMPETITION")
          [ -n "$INPUT_TEAM" ] && ARGS+=("--team=$INPUT_TEAM")
          echo "recap args: ${ARGS[*]}"
          pnpm recap:ci -- "${ARGS[@]}"
