name: Publish AI Data Centers daily edition

# Freezes the draft edition composed at 08:15 UTC: status → published, the
# sequential edition number, published_at, then a signed ping to vizmaya.fyi
# that re-renders /ai-data-centers/daily and /ai-data-centers/daily/[date].
# A published row is never updated again; corrections run in the next edition.
#
# Runs at 09:00 UTC — the draft goes public whether or not an editor has
# looked at it — and again at 09:30 for a draft an editor put on Hold (30
# minutes, once). The 09:30 run is a no-op when 09:00 already published.
# Manual dispatch with force=true publishes through a hold (the admin's
# "Publish now" does the same in-process).
#
# Required repo secrets (in the `Production` environment so secrets.X resolves):
#   NEXT_PUBLIC_SUPABASE_URL   — same value as Vercel env
#   SUPABASE_SERVICE_ROLE_KEY  — write dc_editions
#   ADMIN_SESSION_SECRET       — signs the revalidate ping (already used by the render workflows)

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the draft is on hold'
        type: boolean
        default: false

concurrency:
  group: publish-dc-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    defaults:
      run:
        working-directory: apps/vizmaya-fyi

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 picks it up from the root
      # package.json's `packageManager` field and rejects having both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/realtime-js needs native WebSocket which Node 20 doesn't have.
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish edition
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: pnpm ai-data-centers:publish-edition ${{ github.event.inputs.force == 'true' && '-- --force' || '' }}
